[package]
name = "haproxy-spoa-hub-plugin-sso-auth"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
license = "Apache-2.0"
description = "HAProxy SPOA hub plugin for SSO authentication via OIDC and SAML"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
haproxy-spoa-hub-plugin-api = { git = "https://gitlab.com/haproxy-haptic/haproxy-spoa-hub.git", version = "0.2" }
abi_stable = "0.11"
openidconnect = { version = "4.0", default-features = false, features = ["ureq", "rustls-tls"] }
samael = { git = "https://github.com/njaremko/samael.git", features = ["xmlsec"] }
aes-gcm = "0.10"
hkdf = "0.13"
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
lru = "0.17"
log = "0.4"
base64 = "0.22"
sha2 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
flate2 = "1"
serde_json = "1"

[dev-dependencies]
tiny_http = "0.12"
ureq = "3"

[profile.release]
lto = true
codegen-units = 1

[lints.rust]
dead_code = "warn"
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
similar_names = "allow"
