plugin_dir = "/opt/spoa-plugins"
default_timeout_ms = 100
log_level = "info"

[[listeners]]
type = "unix"
address = "/var/run/haproxy-spoa-hub.sock"

[[plugins]]
name = "sso_auth"
library = "libsso_auth_plugin.so"
messages = ["check-sso-auth"]
timeout_ms = 10000

[plugins.params]
# Global cookie secret; optional when every provider sets cookie_secret(_file).
cookie_secret_1_file = "/run/secrets/sso/cookie-secret"
# cookie_domain = "example.com"   # default: host-only cookies
# cookie_secret_2 = "rotation-secret-at-least-16-chars"
# current_cookie_secret = 1
# cookie_lifetime_secs = 36000
# default_timeout_ms = 5000
# fail_open = false
# max_providers = 256
# clock_skew_secs = 60
# discovery_ttl_secs = 3600
# jwks_ttl_secs = 3600

[plugins.params.providers.mykeycloak]
protocol = "oidc"
client_id = "haproxy-app"
client_secret_file = "/run/secrets/sso/client-secret"
discovery_url = "https://keycloak.example.com/realms/main/.well-known/openid-configuration"
# A path is completed with the request's host (request_host arg).
redirect_uri = "/app/oauth2/callback"
scopes = ["openid", "email", "profile"]
extract_claims = ["email", "name"]
groups_claim = "groups"
pass_token = "id_token"
