global
    log stdout format raw local0 info

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend https
    bind *:443 ssl crt /etc/ssl/certs/
    filter spoe engine sso-auth config /etc/haproxy/spoe-sso-auth.conf

    # 1. Map routes to providers (defined in hub.toml [plugins.params.providers.*])
    http-request set-var(txn.sso_provider) str(mykeycloak) if { path_beg /app }
    http-request set-var(txn.sso_groups) str(/app-admins) if { path_beg /app/admin }

    # 2. Trigger SSO check
    http-request send-spoe-group sso-auth check-sso-auth-group if { var(txn.sso_provider) -m found }

    # 3. Never let the client supply identity
    http-request del-header Authorization if { var(txn.spoe.sso_auth.pass_token) -m bool }
    http-request del-header X-Auth-Email if { var(txn.sso_provider) -m found }

    # 4. Handle auth decisions (a missing verdict denies)
    http-request redirect location %[var(txn.spoe.sso_auth.redirect_url)] if { var(txn.spoe.sso_auth.action) -m str redirect }
    http-request deny deny_status 403 if { var(txn.spoe.sso_auth.action) -m str forbidden }
    http-request deny deny_status 401 if { var(txn.sso_provider) -m found } !{ var(txn.spoe.sso_auth.allowed) -m bool }

    # 5. Cookies: http-after-response also covers HAProxy's own redirects
    http-after-response add-header Set-Cookie %[var(txn.spoe.sso_auth.set_auth_state_header)] if { var(txn.spoe.sso_auth.set_auth_state_header) -m found }
    http-after-response add-header Set-Cookie %[var(txn.spoe.sso_auth.set_cookie_header)] if { var(txn.spoe.sso_auth.set_cookie_header) -m found }
    http-after-response add-header Set-Cookie %[var(txn.spoe.sso_auth.set_cookie_header_1)] if { var(txn.spoe.sso_auth.set_cookie_header_1) -m found }
    http-after-response add-header Set-Cookie %[var(txn.spoe.sso_auth.set_cookie_header_2)] if { var(txn.spoe.sso_auth.set_cookie_header_2) -m found }

    # 6. Forward identity to the backend
    http-request set-header Authorization "Bearer %[var(txn.spoe.sso_auth.token)]" if { var(txn.spoe.sso_auth.token) -m found }
    http-request set-header X-Auth-Email %[var(txn.spoe.sso_auth.email)] if { var(txn.spoe.sso_auth.email) -m found }

    default_backend app

backend app
    server app1 127.0.0.1:8080

backend spoa-hub-backend
    mode tcp
    server hub unix@/var/run/haproxy-spoa-hub.sock
