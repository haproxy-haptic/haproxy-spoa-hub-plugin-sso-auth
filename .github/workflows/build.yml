name: build

on:
  workflow_call:

permissions:
  contents: read

env:
  # renovate: datasource=crate depName=cargo-auditable
  CARGO_AUDITABLE_VERSION: "0.7.4"
  GLIBC_VERSION: "2.36"
  LIB_NAME: libhaproxy_spoa_hub_plugin_sso_auth

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        run: |
          docker buildx build \
            --platform "linux/${ARCH}" \
            --build-arg "CARGO_AUDITABLE_VERSION=${CARGO_AUDITABLE_VERSION}" \
            --file Dockerfile.ci \
            --output "type=local,dest=./output" \
            .
          name="${LIB_NAME}-${ARCH}-glibc${GLIBC_VERSION}.so"
          mkdir -p artifacts
          cp "output/${LIB_NAME}.so" "artifacts/${name}"
          ls -lh "artifacts/${name}"
          (cd artifacts && sha256sum "${name}" > "${name}.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-${{ matrix.arch }}
          path: artifacts/
          if-no-files-found: error

  # Cross-compiled: libclang under QEMU armv7 produces wrong struct layouts.
  build-armv7:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        run: |
          docker buildx build \
            --build-arg "CARGO_AUDITABLE_VERSION=${CARGO_AUDITABLE_VERSION}" \
            --file ci/Dockerfile.armv7 \
            --output "type=local,dest=./output" \
            .
          name="${LIB_NAME}-armv7-glibc${GLIBC_VERSION}.so"
          mkdir -p artifacts
          cp "output/${LIB_NAME}.so" "artifacts/${name}"
          ls -lh "artifacts/${name}"
          (cd artifacts && sha256sum "${name}" > "${name}.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-armv7
          path: artifacts/
          if-no-files-found: error

  smoke-arm64:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-arm64
          path: artifacts/
      - run: tests/smoke/run.sh --arch arm64 --mode oidc-flow

  smoke-armv7:
    needs: build-armv7
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-armv7
          path: artifacts/
      - run: tests/smoke/run.sh --arch armv7 --mode load-only
