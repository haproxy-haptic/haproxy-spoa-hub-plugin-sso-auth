apiVersion: apps/v1
kind: Deployment
metadata:
  name: haproxy-hub
  namespace: e2e-sso-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: haproxy-hub
  template:
    metadata:
      labels:
        app: haproxy-hub
    spec:
      containers:
      - name: haproxy
        image: haproxytech/haproxy-debian:3.3
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: haproxy-config
          mountPath: /usr/local/etc/haproxy/haproxy.cfg
          subPath: haproxy.cfg
        - name: haproxy-config
          mountPath: /etc/haproxy/spoe-sso-auth.conf
          subPath: spoe-sso-auth.conf
        - name: sso-maps
          mountPath: /etc/haproxy/maps
        - name: spoe-socket
          mountPath: /var/run/spoe
      - name: hub
        image: e2e-hub:latest
        imagePullPolicy: Never
        args: ["--config", "/config/config.toml"]
        volumeMounts:
        - name: hub-config
          mountPath: /config
        - name: spoe-socket
          mountPath: /var/run/spoe
      volumes:
      - name: haproxy-config
        configMap:
          name: haproxy-config
      - name: hub-config
        configMap:
          name: hub-config
      - name: sso-maps
        configMap:
          name: sso-maps
      - name: spoe-socket
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: haproxy-hub
  namespace: e2e-sso-auth
spec:
  type: NodePort
  selector:
    app: haproxy-hub
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
