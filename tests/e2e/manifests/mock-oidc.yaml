apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-oidc
  namespace: e2e-sso-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-oidc
  template:
    metadata:
      labels:
        app: mock-oidc
    spec:
      containers:
      - name: mock-oidc
        image: ghcr.io/navikt/mock-oauth2-server:2.1.10
        ports:
        - containerPort: 8080
        env:
        - name: JSON_CONFIG_PATH
          value: /config/config.json
        volumeMounts:
        - name: config
          mountPath: /config
        readinessProbe:
          httpGet:
            path: /default/.well-known/openid-configuration
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: mock-oidc-config
---
apiVersion: v1
kind: Service
metadata:
  name: mock-oidc
  namespace: e2e-sso-auth
spec:
  selector:
    app: mock-oidc
  ports:
  - port: 8080
    targetPort: 8080
